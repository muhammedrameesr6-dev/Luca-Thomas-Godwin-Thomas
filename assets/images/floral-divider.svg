<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 60" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="divPinkPetal" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FAF0EE"/>
      <stop offset="60%" stop-color="#E8C9C5"/>
      <stop offset="100%" stop-color="#D9A8A2"/>
    </radialGradient>
    <radialGradient id="divBluePetal" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#EDF4FA"/>
      <stop offset="60%" stop-color="#AFC7E0"/>
      <stop offset="100%" stop-color="#8EAECB"/>
    </radialGradient>
    <radialGradient id="divYellowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8E0"/>
      <stop offset="70%" stop-color="#E9D99D"/>
      <stop offset="100%" stop-color="#D8C27B"/>
    </radialGradient>
    <linearGradient id="divFadeLineL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AFC7E0" stop-opacity="0"/>
      <stop offset="60%" stop-color="#AFC7E0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#AFC7E0" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="divFadeLineR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AFC7E0" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#AFC7E0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#AFC7E0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g transform="translate(0, 0)">
    <!-- Fine lines -->
    <line x1="30" y1="30" x2="240" y2="30" stroke="url(#divFadeLineL)" stroke-width="1"/>
    <circle cx="244" cy="30" r="1.5" fill="#AFC7E0" opacity="0.8"/>
    <circle cx="250" cy="30" r="2" fill="#E9D99D"/>
    
    <line x1="360" y1="30" x2="570" y2="30" stroke="url(#divFadeLineR)" stroke-width="1"/>
    <circle cx="356" cy="30" r="1.5" fill="#AFC7E0" opacity="0.8"/>
    <circle cx="350" cy="30" r="2" fill="#E9D99D"/>

    <!-- Left floral branch -->
    <path d="M 270,30 C 260,20 252,22 248,18" stroke="#AFC7E0" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 268,30 C 258,38 250,35 245,39" stroke="#AFC7E0" stroke-width="1" stroke-linecap="round"/>
    <!-- Petals left -->
    <ellipse cx="246" cy="17" rx="5" ry="3" transform="rotate(-30 246 17)" fill="url(#divBluePetal)" opacity="0.85"/>
    <ellipse cx="244" cy="40" rx="5" ry="3" transform="rotate(25 244 40)" fill="url(#divPinkPetal)" opacity="0.85"/>
    <circle cx="260" cy="23" r="2" fill="url(#divYellowCenter)"/>

    <!-- Right floral branch -->
    <path d="M 330,30 C 340,20 348,22 352,18" stroke="#AFC7E0" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 332,30 C 342,38 350,35 355,39" stroke="#AFC7E0" stroke-width="1" stroke-linecap="round"/>
    <!-- Petals right -->
    <ellipse cx="354" cy="17" rx="5" ry="3" transform="rotate(30 354 17)" fill="url(#divPinkPetal)" opacity="0.85"/>
    <ellipse cx="356" cy="40" rx="5" ry="3" transform="rotate(-25 356 40)" fill="url(#divBluePetal)" opacity="0.85"/>
    <circle cx="340" cy="23" r="2" fill="url(#divYellowCenter)"/>

    <!-- Center Cross Motif -->
    <g transform="translate(300, 30)">
      <!-- Golden / Soft Blue Radiant Halo -->
      <circle cx="0" cy="0" r="12" stroke="#E9D99D" stroke-width="0.8" stroke-dasharray="1.5 2" fill="none" opacity="0.7"/>
      <!-- Cross Vertical -->
      <path d="M 0,-18 L 0,18" stroke="#343B45" stroke-width="1.6" stroke-linecap="square"/>
      <path d="M -2,-18 L 2,-18 M -2,18 L 2,18" stroke="#343B45" stroke-width="1.2"/>
      <!-- Cross Horizontal -->
      <path d="M -11,-4 L 11,-4" stroke="#343B45" stroke-width="1.6" stroke-linecap="square"/>
      <path d="M -11,-6 L -11,-2 M 11,-6 L 11,-2" stroke="#343B45" stroke-width="1.2"/>
      <!-- Center Gold Accent Diamond -->
      <polygon points="0,-6 2,-4 0,-2 -2,-4" fill="#E9D99D"/>
    </g>
  </g>
</svg>