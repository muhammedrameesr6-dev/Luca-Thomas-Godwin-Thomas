<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="crossGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#E9D99D" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#AFC7E0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FAF7F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crossMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A059"/>
      <stop offset="35%" stop-color="#E9D99D"/>
      <stop offset="70%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8C6D37"/>
    </linearGradient>
  </defs>

  <!-- Radiant sunburst halo behind intersection -->
  <circle cx="60" cy="56" r="32" fill="url(#crossGlow)"/>
  <circle cx="60" cy="56" r="24" stroke="#E9D99D" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6"/>
  
  <!-- Subtle Rays -->
  <line x1="60" y1="26" x2="60" y2="20" stroke="#E9D99D" stroke-width="1" stroke-linecap="round"/>
  <line x1="60" y1="86" x2="60" y2="92" stroke="#E9D99D" stroke-width="1" stroke-linecap="round"/>
  <line x1="30" y1="56" x2="24" y2="56" stroke="#E9D99D" stroke-width="1" stroke-linecap="round"/>
  <line x1="90" y1="56" x2="96" y2="56" stroke="#E9D99D" stroke-width="1" stroke-linecap="round"/>
  <line x1="38" y1="34" x2="33" y2="29" stroke="#E9D99D" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="82" y1="34" x2="87" y2="29" stroke="#E9D99D" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="38" y1="78" x2="33" y2="83" stroke="#E9D99D" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="82" y1="78" x2="87" y2="83" stroke="#E9D99D" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Main Ornate Cross Body -->
  <!-- Vertical Beam -->
  <path d="M 57,14 L 63,14 L 63,144 L 57,144 Z" fill="url(#crossMetal)"/>
  <!-- Top Finial -->
  <path d="M 54,14 L 66,14 L 60,6 Z" fill="url(#crossMetal)"/>
  <circle cx="60" cy="6" r="2.5" fill="#E9D99D"/>
  <!-- Bottom Finial -->
  <path d="M 54,144 L 66,144 L 60,152 Z" fill="url(#crossMetal)"/>
  <circle cx="60" cy="152" r="2.5" fill="#E9D99D"/>

  <!-- Horizontal Beam -->
  <path d="M 22,53 L 98,53 L 98,59 L 22,59 Z" fill="url(#crossMetal)"/>
  <!-- Left Finial -->
  <path d="M 22,50 L 22,62 L 14,56 Z" fill="url(#crossMetal)"/>
  <circle cx="14" cy="56" r="2.5" fill="#E9D99D"/>
  <!-- Right Finial -->
  <path d="M 98,50 L 98,62 L 106,56 Z" fill="url(#crossMetal)"/>
  <circle cx="106" cy="56" r="2.5" fill="#E9D99D"/>

  <!-- Center Diamond & Trefoil flourish -->
  <polygon points="60,48 68,56 60,64 52,56" fill="#FAF7F0" stroke="#C5A059" stroke-width="1.2"/>
  <circle cx="60" cy="56" r="2" fill="#E8C9C5"/>
</svg>