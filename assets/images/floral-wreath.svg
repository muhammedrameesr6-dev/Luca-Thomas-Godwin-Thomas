<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="wrPink" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FAF0EE"/>
      <stop offset="60%" stop-color="#E8C9C5"/>
      <stop offset="100%" stop-color="#D9A8A2"/>
    </radialGradient>
    <radialGradient id="wrBlue" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#EDF4FA"/>
      <stop offset="60%" stop-color="#AFC7E0"/>
      <stop offset="100%" stop-color="#8EAECB"/>
    </radialGradient>
    <radialGradient id="wrYellow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8E0"/>
      <stop offset="70%" stop-color="#E9D99D"/>
      <stop offset="100%" stop-color="#D8C27B"/>
    </radialGradient>
  </defs>

  <g transform="translate(120, 120)">
    <!-- Thin dual ring guidelines -->
    <circle cx="0" cy="0" r="95" stroke="#AFC7E0" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.6"/>
    <circle cx="0" cy="0" r="102" stroke="#AFC7E0" stroke-width="0.5" opacity="0.4"/>

    <!-- Left botanical vine -->
    <path d="M 0,-98 C -60,-98 -102,-50 -102,10 C -102,60 -65,100 -5,105" stroke="#77736D" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- Right botanical vine -->
    <path d="M 0,-98 C 60,-98 102,-50 102,10 C 102,60 65,100 5,105" stroke="#77736D" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7"/>

    <!-- Tender Leaf clusters along the wreath -->
    <!-- Top-left leaves -->
    <ellipse cx="-45" cy="-88" rx="7" ry="3.5" transform="rotate(-40 -45 -88)" fill="url(#wrBlue)" opacity="0.85"/>
    <ellipse cx="-75" cy="-65" rx="7" ry="3.5" transform="rotate(-65 -75 -65)" fill="url(#wrBlue)" opacity="0.85"/>
    <circle cx="-60" cy="-80" r="2.5" fill="url(#wrYellow)"/>

    <!-- Mid-left leaves -->
    <ellipse cx="-100" cy="-20" rx="7" ry="3.5" transform="rotate(-85 -100 -20)" fill="url(#wrPink)" opacity="0.85"/>
    <ellipse cx="-102" cy="25" rx="7" ry="3.5" transform="rotate(-105 -102 25)" fill="url(#wrBlue)" opacity="0.85"/>
    <circle cx="-98" cy="2" r="3" fill="url(#wrYellow)"/>

    <!-- Bottom-left leaves -->
    <ellipse cx="-80" cy="65" rx="7" ry="3.5" transform="rotate(-130 -80 65)" fill="url(#wrBlue)" opacity="0.85"/>
    <ellipse cx="-45" cy="92" rx="7" ry="3.5" transform="rotate(-155 -45 92)" fill="url(#wrPink)" opacity="0.85"/>

    <!-- Top-right leaves -->
    <ellipse cx="45" cy="-88" rx="7" ry="3.5" transform="rotate(40 45 -88)" fill="url(#wrBlue)" opacity="0.85"/>
    <ellipse cx="75" cy="-65" rx="7" ry="3.5" transform="rotate(65 75 -65)" fill="url(#wrBlue)" opacity="0.85"/>
    <circle cx="60" cy="-80" r="2.5" fill="url(#wrYellow)"/>

    <!-- Mid-right leaves -->
    <ellipse cx="100" cy="-20" rx="7" ry="3.5" transform="rotate(85 100 -20)" fill="url(#wrPink)" opacity="0.85"/>
    <ellipse cx="102" cy="25" rx="7" ry="3.5" transform="rotate(105 102 25)" fill="url(#wrBlue)" opacity="0.85"/>
    <circle cx="98" cy="2" r="3" fill="url(#wrYellow)"/>

    <!-- Bottom-right leaves -->
    <ellipse cx="80" cy="65" rx="7" ry="3.5" transform="rotate(130 80 65)" fill="url(#wrBlue)" opacity="0.85"/>
    <ellipse cx="45" cy="92" rx="7" ry="3.5" transform="rotate(155 45 92)" fill="url(#wrPink)" opacity="0.85"/>

    <!-- Top Apex Floral Composition -->
    <g transform="translate(0, -98)">
      <circle cx="-12" cy="2" r="4.5" fill="url(#wrBlue)"/>
      <circle cx="12" cy="2" r="4.5" fill="url(#wrPink)"/>
      <circle cx="0" cy="0" r="7" fill="url(#wrPink)"/>
      <circle cx="0" cy="0" r="3" fill="url(#wrYellow)"/>
      <!-- Tiny Cross atop wreath -->
      <line x1="0" y1="-14" x2="0" y2="-6" stroke="#343B45" stroke-width="1.2"/>
      <line x1="-3" y1="-11" x2="3" y2="-11" stroke="#343B45" stroke-width="1.2"/>
    </g>

    <!-- Bottom Ribbon / Blossom cluster -->
    <g transform="translate(0, 105)">
      <circle cx="0" cy="0" r="6" fill="url(#wrYellow)"/>
      <circle cx="-9" cy="-2" r="4" fill="url(#wrPink)"/>
      <circle cx="9" cy="-2" r="4" fill="url(#wrBlue)"/>
      <path d="M -8,4 C -14,14 -22,18 -26,22 M 8,4 C 14,14 22,18 26,22" stroke="#AFC7E0" stroke-width="1" stroke-linecap="round"/>
    </g>
  </g>
</svg>