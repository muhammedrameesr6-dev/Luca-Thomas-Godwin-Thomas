<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft watercolor petal gradients -->
    <radialGradient id="pinkPetal" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FAF0EE" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#E8C9C5" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#D9A8A2" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="bluePetal" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#EDF4FA" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#AFC7E0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8EAECB" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="yellowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8E0"/>
      <stop offset="70%" stop-color="#E9D99D"/>
      <stop offset="100%" stop-color="#D8C27B"/>
    </radialGradient>
    <linearGradient id="goldStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AFC7E0" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#C8B88A" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#77736D" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="watercolorBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#watercolorBlur)">
    <!-- Swirling botanical stems -->
    <path d="M 0,0 C 80,10 140,40 190,110 C 220,150 240,220 260,300" stroke="url(#goldStem)" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 0,0 C 20,70 60,130 110,180 C 150,220 210,250 290,260" stroke="url(#goldStem)" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 0,0 C 50,30 90,70 120,120" stroke="url(#goldStem)" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Subtle tender leaves -->
    <!-- Leaf 1 (pastel blue) -->
    <path d="M 120,70 C 135,50 160,55 165,70 C 160,85 135,85 120,70 Z" fill="url(#bluePetal)" opacity="0.8"/>
    <!-- Leaf 2 (soft ivory/blue) -->
    <path d="M 70,120 C 55,140 60,165 75,165 C 90,160 85,135 70,120 Z" fill="url(#bluePetal)" opacity="0.8"/>
    <!-- Leaf 3 (small pastel bud) -->
    <path d="M 175,130 C 190,120 210,130 205,145 C 195,155 180,145 175,130 Z" fill="url(#bluePetal)" opacity="0.75"/>
    <path d="M 130,175 C 120,195 130,215 145,210 C 155,200 145,185 130,175 Z" fill="url(#bluePetal)" opacity="0.75"/>

    <!-- Soft Yellow Accent Berries/Pips -->
    <circle cx="140" cy="50" r="3.5" fill="url(#yellowCenter)"/>
    <circle cx="150" cy="42" r="2.8" fill="url(#yellowCenter)"/>
    <circle cx="50" cy="140" r="3.5" fill="url(#yellowCenter)"/>
    <circle cx="42" cy="150" r="2.8" fill="url(#yellowCenter)"/>
    <circle cx="215" cy="170" r="3.2" fill="url(#yellowCenter)"/>
    <circle cx="170" cy="215" r="3.2" fill="url(#yellowCenter)"/>

    <!-- Small Secondary Flower: Pastel Blue (top right) -->
    <g transform="translate(190, 95)">
      <path d="M 0,-16 C 5,-16 10,-8 0,0 C -10,-8 -5,-16 0,-16 Z" fill="url(#bluePetal)"/>
      <path d="M 16,0 C 16,5 8,10 0,0 C 8,-10 16,-5 16,0 Z" fill="url(#bluePetal)"/>
      <path d="M 0,16 C -5,16 -10,8 0,0 C 10,8 5,16 0,16 Z" fill="url(#bluePetal)"/>
      <path d="M -16,0 C -16,-5 -8,-10 0,0 C -8,10 -16,5 -16,0 Z" fill="url(#bluePetal)"/>
      <circle cx="0" cy="0" r="4" fill="url(#yellowCenter)"/>
    </g>

    <!-- Small Secondary Flower: Soft Yellow & Ivory (bottom left) -->
    <g transform="translate(95, 190)">
      <path d="M 0,-16 C 5,-16 10,-8 0,0 C -10,-8 -5,-16 0,-16 Z" fill="url(#yellowCenter)" opacity="0.9"/>
      <path d="M 16,0 C 16,5 8,10 0,0 C 8,-10 16,-5 16,0 Z" fill="url(#yellowCenter)" opacity="0.9"/>
      <path d="M 0,16 C -5,16 -10,8 0,0 C 10,8 5,16 0,16 Z" fill="url(#yellowCenter)" opacity="0.9"/>
      <path d="M -16,0 C -16,-5 -8,-10 0,0 C -8,10 -16,5 -16,0 Z" fill="url(#yellowCenter)" opacity="0.9"/>
      <circle cx="0" cy="0" r="4" fill="#D8C27B"/>
    </g>

    <!-- Main Feature Blossom: Blush Pink Hydrangea / English Rose (Center) -->
    <g transform="translate(110, 110)">
      <!-- Outer Petals -->
      <path d="M 0,-34 C 12,-34 22,-18 0,0 C -22,-18 -12,-34 0,-34 Z" fill="url(#pinkPetal)"/>
      <path d="M 28,-22 C 38,-12 30,8 0,0 C 8,-22 20,-30 28,-22 Z" fill="url(#pinkPetal)"/>
      <path d="M 34,0 C 34,12 18,22 0,0 C 18,-22 34,-12 34,0 Z" fill="url(#pinkPetal)"/>
      <path d="M 22,28 C 12,38 -8,30 0,0 C 22,8 30,20 22,28 Z" fill="url(#pinkPetal)"/>
      <path d="M 0,34 C -12,34 -22,18 0,0 C 22,18 12,34 0,34 Z" fill="url(#pinkPetal)"/>
      <path d="M -28,22 C -38,12 -30,-8 0,0 C -8,22 -20,30 -28,22 Z" fill="url(#pinkPetal)"/>
      <path d="M -34,0 C -34,-12 -18,-22 0,0 C -18,22 -34,12 -34,0 Z" fill="url(#pinkPetal)"/>
      <path d="M -22,-28 C -12,-38 8,-30 0,0 C -22,-8 -30,-20 -22,-28 Z" fill="url(#pinkPetal)"/>

      <!-- Inner delicate Petals -->
      <path d="M 0,-20 C 8,-20 12,-10 0,0 C -12,-10 -8,-20 0,-20 Z" fill="url(#pinkPetal)" opacity="0.95"/>
      <path d="M 20,0 C 20,8 10,12 0,0 C 10,-12 20,-8 20,0 Z" fill="url(#pinkPetal)" opacity="0.95"/>
      <path d="M 0,20 C -8,20 -12,10 0,0 C 12,10 8,20 0,20 Z" fill="url(#pinkPetal)" opacity="0.95"/>
      <path d="M -20,0 C -20,-8 -10,-12 0,0 C -10,12 -20,8 -20,0 Z" fill="url(#pinkPetal)" opacity="0.95"/>

      <!-- Golden Stamen Cluster -->
      <circle cx="0" cy="0" r="7" fill="url(#yellowCenter)"/>
      <circle cx="-2" cy="-2" r="1.5" fill="#C5A059"/>
      <circle cx="2" cy="-1" r="1.3" fill="#C5A059"/>
      <circle cx="0" cy="3" r="1.4" fill="#C5A059"/>
    </g>

    <!-- Delicate corner filigree framing -->
    <path d="M 12,45 L 12,12 L 45,12" stroke="#AFC7E0" stroke-width="0.9" fill="none" opacity="0.6"/>
    <circle cx="12" cy="12" r="2" fill="#AFC7E0" opacity="0.7"/>
  </g>
</svg>