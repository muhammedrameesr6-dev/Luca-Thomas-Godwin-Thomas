<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="doveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#DCE9F5"/>
      <stop offset="100%" stop-color="#AFC7E0"/>
    </linearGradient>
  </defs>
  <!-- Flying Holy Spirit Dove -->
  <g transform="translate(0, 0)">
    <!-- Body & Head -->
    <path d="M 32,48 C 28,42 24,36 28,28 C 30,24 35,22 38,24 C 42,26 44,30 46,36 C 52,38 60,42 70,44 C 78,45 88,48 94,42 C 92,52 82,56 72,56 C 60,56 50,54 44,52 C 38,55 35,52 32,48 Z" fill="url(#doveGrad)" stroke="#AFC7E0" stroke-width="0.8"/>
    <!-- Upper Wing -->
