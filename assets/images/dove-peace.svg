    <path d="M 52,24 C 58,16 66,10 74,8" stroke="#AFC7E0" stroke-width="0.6"/>
    <!-- Tail Feathers -->
    <path d="M 28,46 C 20,48 10,50 6,56 C 8,50 14,46 22,44 C 14,42 8,38 4,34 C 12,38 20,42 26,42" fill="url(#doveGrad)" stroke="#AFC7E0" stroke-width="0.6"/>
    <!-- Olive Sprig in Beak -->
    <path d="M 38,24 C 44,20 48,18 52,18" stroke="#C5A059" stroke-width="0.9" stroke-linecap="round"/>
    <ellipse cx="46" cy="18" rx="3" ry="1.5" transform="rotate(-25 46 18)" fill="#E9D99D"/>
    <ellipse cx="51" cy="17" rx="3" ry="1.5" transform="rotate(15 51 17)" fill="#E9D99D"/>
