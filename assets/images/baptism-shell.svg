<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#DCE9F5"/>
      <stop offset="100%" stop-color="#AFC7E0"/>
    </linearGradient>
  </defs>
  <!-- Scallop Baptismal Shell with 3 water drops of grace -->
  <g transform="translate(40, 36)">
    <!-- Shell Fluting -->
    <path d="M 0,22 C -24,22 -32,-6 -30,-16 C -20,-24 -10,-24 0,-18 C 10,-24 20,-24 30,-16 C 32,-6 24,22 0,22 Z" fill="url(#shellGrad)" stroke="#AFC7E0" stroke-width="1.2"/>
    <!-- Ribs -->
    <path d="M 0,22 L 0,-18" stroke="#AFC7E0" stroke-width="0.9" opacity="0.8"/>
    <path d="M 0,22 C -6,10 -14,-5 -15,-20" stroke="#AFC7E0" stroke-width="0.8" opacity="0.7"/>
    <path d="M 0,22 C 6,10 14,-5 15,-20" stroke="#AFC7E0" stroke-width="0.8" opacity="0.7"/>
    <path d="M 0,22 C -12,12 -22,2 -25,-14" stroke="#AFC7E0" stroke-width="0.7" opacity="0.6"/>
    <path d="M 0,22 C 12,12 22,2 25,-14" stroke="#AFC7E0" stroke-width="0.7" opacity="0.6"/>

    <!-- 3 Water Drops of Trinitarian Grace below -->
    <path d="M 0,28 C -3,32 -3,35 0,37 C 3,35 3,32 0,28 Z" fill="#AFC7E0"/>
    <path d="M -8,27 C -10,30 -10,33 -8,35 C -6,33 -6,30 -8,27 Z" fill="#AFC7E0" opacity="0.85"/>
    <path d="M 8,27 C 6,30 6,33 8,35 C 10,33 10,30 8,27 Z" fill="#AFC7E0" opacity="0.85"/>

    <!-- Delicate Cross atop shell -->
    <line x1="0" y1="-22" x2="0" y2="-30" stroke="#C5A059" stroke-width="1.2"/>
    <line x1="-3.5" y1="-27" x2="3.5" y2="-27" stroke="#C5A059" stroke-width="1.2"/>
  </g>
</svg>